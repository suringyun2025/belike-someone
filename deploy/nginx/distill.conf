# ---------------------------------------------------------------------------
# 蒸馏平台 · who-is-spy.online
#
# nginx 是唯一公网入口：应用本身只监听 127.0.0.1:8000。
# 证书复用已有的 who-is-spy.online（Let's Encrypt，自动续期由 certbot 管理）。
#
# 安装：
#   sudo cp distill.conf /etc/nginx/sites-available/distill
#   sudo ln -sf /etc/nginx/sites-available/distill /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# 登录接口单独限流，防止撞库；业务接口用较宽的额度。
limit_req_zone $binary_remote_addr zone=distill_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=distill_api:10m rate=120r/m;

upstream distill_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name who-is-spy.online www.who-is-spy.online;

    # certbot 的 HTTP-01 校验路径必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://who-is-spy.online$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.who-is-spy.online;

    ssl_certificate     /etc/letsencrypt/live/who-is-spy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/who-is-spy.online/privkey.pem;

    return 301 https://who-is-spy.online$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name who-is-spy.online;

    ssl_certificate     /etc/letsencrypt/live/who-is-spy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/who-is-spy.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:distill_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 不泄露版本号与确切产品
    server_tokens off;

    # 上传上限必须与后端 DISTILL_MAX_UPLOAD_MB 一致（后端 64MB，这里留余量）。
    # 若两者不一致，nginx 会先返回 413，用户看到的是英文错误页。
    client_max_body_size 72m;
    client_body_timeout 120s;

    access_log /var/log/nginx/distill.access.log;
    error_log  /var/log/nginx/distill.error.log warn;

    # --- 安全响应头 -------------------------------------------------------
    # 应用也设置了这些头；nginx 层再设一次，保证静态资源与错误页也覆盖。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;

    # --- API --------------------------------------------------------------
    location /api/v1/auth/login {
        limit_req zone=distill_login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://distill_backend;
        include /etc/nginx/snippets/distill-proxy.conf;
    }

    location /api/v1/auth/register {
        limit_req zone=distill_login burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://distill_backend;
        include /etc/nginx/snippets/distill-proxy.conf;
    }

    location /api/ {
        limit_req zone=distill_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://distill_backend;
        # 不使用共享 snippet：SSE 的连接要长期保持，读超时必须比普通请求长。
        # 共享 snippet 里的 120s 会让进度流在 2 分钟后被切断。
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
        # SSE 不能被缓冲，否则前端看不到实时更新。
        proxy_buffering off;
        proxy_cache off;
    }

    # --- 前端静态资源 ------------------------------------------------------
    # 带内容哈希的资源可以长期缓存。
    location /assets/ {
        proxy_pass http://distill_backend;
        include /etc/nginx/snippets/distill-proxy.conf;
        proxy_set_header If-None-Match $http_if_none_match;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 单页应用回退：未知路径交给后端返回 index.html
    location / {
        proxy_pass http://distill_backend;
        include /etc/nginx/snippets/distill-proxy.conf;
    }

    # 拒绝明显的探测路径，减少日志噪音
    location ~* \.(php|asp|aspx|jsp|cgi)$ {
        return 404;
    }
}